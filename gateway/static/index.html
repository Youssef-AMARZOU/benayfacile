<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bénayfacile — BET Structure (BAEL / RPS)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="aller-contenu" href="#main">Aller au contenu</a>
<div class="shell">
  <aside class="rail">
    <div class="marque">
      <svg class="marque-signe" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="3" width="26" height="26" rx="1.5" />
        <rect x="7.5" y="7.5" width="17" height="17" class="cadre" />
        <circle cx="9.5" cy="9.5" r="2.2" class="acier" /><circle cx="22.5" cy="9.5" r="2.2" class="acier" />
        <circle cx="9.5" cy="22.5" r="2.2" class="acier" /><circle cx="22.5" cy="22.5" r="2.2" class="acier" />
      </svg>
      <div>
        <div class="marque-nom">Bénayfacile</div>
        <div class="marque-normes">BAEL 91 &nbsp;/&nbsp; RPS 2011</div>
      </div>
    </div>
    <div class="facade" aria-hidden="true"></div>
    <nav class="tabs" id="tabs" aria-label="Modules de calcul"></nav>
    <div class="cartouche" id="cartouche"></div>
    <details class="reglages" id="reglages">
      <summary>Affichage</summary>
      <div class="reglage" role="group" aria-labelledby="lbl-langue">
        <span id="lbl-langue">Langue</span>
        <div class="segments" data-pref="langue">
          <button type="button" data-val="fr" lang="fr">Français</button>
          <button type="button" data-val="en" lang="en" translate="no">English</button>
        </div>
      </div>
      <div class="reglage" role="group" aria-labelledby="lbl-niveau">
        <span id="lbl-niveau">Niveau</span>
        <div class="segments" data-pref="niveau">
          <button type="button" data-val="guide" title="Aides sous les champs, verdicts en clair, conseils">Guidé</button>
          <button type="button" data-val="expert" title="Écran dense, détail JSON, raccourcis clavier">Expert</button>
        </div>
        <p class="raccourcis">Entrée : calculer. Alt + 1 à 9 : changer de module.</p>
      </div>
      <div class="reglage" role="group" aria-labelledby="lbl-style">
        <span id="lbl-style">Style</span>
        <div class="segments" data-pref="style">
          <button type="button" data-val="maroc">Maroc</button>
          <button type="button" data-val="stade">Stade</button>
          <button type="button" data-val="plan">Plan</button>
        </div>
      </div>
      <div class="reglage" role="group" aria-labelledby="lbl-theme">
        <span id="lbl-theme">Thème</span>
        <div class="segments" data-pref="theme">
          <button type="button" data-val="auto" title="Suit le réglage de Windows">Auto</button>
          <button type="button" data-val="clair">Clair</button>
          <button type="button" data-val="sombre">Sombre</button>
        </div>
      </div>
      <div class="reglage" role="group" aria-labelledby="lbl-taille">
        <span id="lbl-taille">Taille du texte</span>
        <div class="segments" data-pref="taille">
          <button type="button" data-val="1" aria-label="Normale">A</button>
          <button type="button" data-val="1.15" aria-label="Grande" class="t-grande">A</button>
          <button type="button" data-val="1.3" aria-label="Très grande" class="t-tres-grande">A</button>
        </div>
      </div>
    </details>
    <div class="health" id="health" aria-live="polite">vérification des services…</div>
    <p class="credit">Développé par M. Youssef AMARZOU — Digital &amp; AI Engineer</p>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<script src="guide.js"></script>
<script src="i18n.js"></script>
<script src="vue3d.js"></script>
<script src="fondations.js"></script>
<script src="app.js"></script>
</body>
</html>
