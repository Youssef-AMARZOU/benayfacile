<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bénayfacile — BET Structure (BAEL / RPS)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="marque">
      <svg class="marque-signe" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="3" width="26" height="26" rx="1.5" />
        <rect x="7.5" y="7.5" width="17" height="17" class="cadre" />
        <circle cx="9.5" cy="9.5" r="2.2" class="acier" /><circle cx="22.5" cy="9.5" r="2.2" class="acier" />
        <circle cx="9.5" cy="22.5" r="2.2" class="acier" /><circle cx="22.5" cy="22.5" r="2.2" class="acier" />
      </svg>
      <div>
        <div class="marque-nom">Bénayfacile</div>
        <div class="marque-normes">BAEL 91 &nbsp;/&nbsp; RPS 2011</div>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Modules de calcul"></nav>
    <div class="cartouche" id="cartouche"></div>
    <div class="health" id="health" aria-live="polite">vérification des services…</div>
  </aside>
  <main id="main"></main>
</div>
<script src="app.js"></script>
</body>
</html>
